<style>

@media (prefers-color-scheme: dark){

}

  --bg:#1b1914; --card:#252219; --ink:#f2ede2; --sub:#b8b0a0;
  --accent:#e08a4f; --accent-dark:#c9622b; --good:#5fbf83; --bad:#e0685f;

html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{

h1{font-size:1.5rem; margin:4px 0 2px; letter-spacing:.3px;}
.tag{color:var(--sub); font-size:.85rem; margin-bottom:18px;}

<script>
/* ---------- FEEDBACK PHRASE POOLS ---------- */
const CORRECT_PHRASES = [
  "Good job", "Fantastic", "Fabulous", "Excellent", "Marvelous",
  "Brilliant", "Outstanding", "Spot on", "Superb", "Spectacular",
  "You're on fire!", "Genius level!", "Absolutely perfect!",
  "Well done", "Amazing work", "Great thinking", "Nailed it", "Impressive"
];
const WRONG_PHRASES = [
  "Oh no, please try again", "Try later", "Better luck next time",
  "So close! Try again!", "Don't give up yet!", "You'll get the next one!",
  "Nice try!", "Oops, not quite!", "Almost there!", "Keep going!"
];
let lastCorrectPhrase = null, lastWrongPhrase = null;

function pickPhrase(pool, last){
  if(pool.length === 1) return pool[0];
  let phrase;
  do { phrase = pool[Math.floor(Math.random()*pool.length)]; } while(phrase === last);
  return phrase;
}

/* ---------- SOUND ENGINE (procedural, no external audio files) ---------- */
function getAudioCtx(){
  if(!window._audioCtx){
    try{ window._audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return window._audioCtx;
}
function burstNoise(ctx, startDelay, duration, gainVal){
  setTimeout(() => {
    try{
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.value = gainVal;
      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 1200;
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start();
    }catch(e){}
  }, startDelay);
}
function playCorrectSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  // a few quick noise bursts approximate a clap/cheer
  burstNoise(ctx, 0, 0.05, 0.18);
  burstNoise(ctx, 90, 0.05, 0.16);
  burstNoise(ctx, 180, 0.06, 0.14);
}
function playWrongSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.14, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.42);
  }catch(e){}
}

/* ---------- SPEECH ---------- */
function speakPhrase(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

/* ---------- VISUAL POPUP ---------- */
let toastTimer = null;
function showToast(text, kind){
  const el = document.getElementById("phrase-toast");
  el.textContent = text;
  el.className = "show " + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 1800);
}

function celebrate(isCorrect){
  const pool = isCorrect ? CORRECT_PHRASES : WRONG_PHRASES;
  const last = isCorrect ? lastCorrectPhrase : lastWrongPhrase;
  const phrase = pickPhrase(pool, last);
  if(isCorrect) lastCorrectPhrase = phrase; else lastWrongPhrase = phrase;
  showToast(phrase, isCorrect ? "correct" : "wrong");
  speakPhrase(phrase);
  if(isCorrect) playCorrectSound(); else playWrongSound();
  return phrase;
}

/* ---------- DATA: Foundation Days 1-3 + Batch 1 (Day 58-63) — English-first, Hindi support line below ---------- */

/* ---------- STATE ---------- */
let progress = {};
try{
  const saved = localStorage.getItem("fea_quest_progress");
  progress = saved ? JSON.parse(saved) : {};
}catch(e){ progress = {}; }

let currentLevelIdx = 0, currentQIdx = 0, currentScore = 0, answered = false, shuffledOpts = [];

function saveProgress(){
  try{ localStorage.setItem("fea_quest_progress", JSON.stringify(progress)); }catch(e){}
}

function starsFor(score, total){
  const pct = score/total;
  if(pct === 1) return 3;
  if(pct >= 0.6) return 2;
  if(pct > 0) return 1;
  return 0;
}

function totalStars(){
  let t = 0;
  Object.values(progress).forEach(p => t += (p.stars||0));
  return t;
}

function renderMap(){
  document.getElementById("total-stars").textContent = totalStars();
  const list = document.getElementById("levels-list");
  list.innerHTML = "";
  LEVELS.forEach((lvl, idx) => {
    const locked = idx > 0 && !progress[LEVELS[idx-1].id];
    const p = progress[lvl.id];
    const div = document.createElement("div");
    div.className = "level-card" + (locked ? " locked" : "");
    div.innerHTML = `
      <div class="level-num">${locked ? "🔒" : (idx+1)}</div>
      <div class="level-info">
        <div class="level-title">${lvl.title}</div>
        <div class="level-sub">${lvl.topic}</div>
      </div>
      <div class="stars">${p ? "★".repeat(p.stars) + "☆".repeat(3-p.stars) : (locked ? "" : "☆☆☆")}</div>
    `;
    if(!locked){
      div.onclick = () => startLevel(idx);
    }
    list.appendChild(div);
  });
}

function startLevel(idx){
  currentLevelIdx = idx;
  currentQIdx = 0;
  currentScore = 0;
  document.getElementById("screen-map").classList.add("hidden");
  document.getElementById("screen-result").classList.add("hidden");
  document.getElementById("screen-quiz").classList.remove("hidden");
  document.getElementById("quiz-title").textContent = LEVELS[idx].title;
  renderQuestion();
}

function shuffle(arr){
  // Fisher-Yates
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderQuestion(){
  answered = false;
  const lvl = LEVELS[currentLevelIdx];
  const q = lvl.questions[currentQIdx];
  document.getElementById("progress-fill").style.width = (currentQIdx/lvl.questions.length*100) + "%";
  const pill = document.getElementById("diff-pill");
  pill.textContent = q.diff.toUpperCase();
  pill.className = "diff-pill diff-" + q.diff;
  document.getElementById("q-text-en").textContent = q.qEn;
  document.getElementById("q-text-hi").textContent = q.qHi;
  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("next-btn").disabled = true;
  document.getElementById("next-btn").textContent = (currentQIdx === lvl.questions.length-1) ? "See Result" : "Next";

  const optsWithIdx = q.opts.map((text, i) => ({text, correct: i === q.a}));
  shuffledOpts = shuffle(optsWithIdx);

  const optsDiv = document.getElementById("options");
  optsDiv.innerHTML = "";
  shuffledOpts.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(btn, opt);
    optsDiv.appendChild(btn);
  });
}

function selectOption(btn, opt){
  if(answered) return;
  answered = true;
  const buttons = document.querySelectorAll("#options .opt");
  buttons.forEach(b => b.disabled = true);
  const phrase = celebrate(opt.correct);
  if(opt.correct){
    btn.classList.add("correct");
    currentScore++;
    document.getElementById("feedback").textContent = "✅ " + phrase + " — sahi jawab!";
  } else {
    btn.classList.add("wrong");
    buttons.forEach((b, i) => { if(shuffledOpts[i].correct) b.classList.add("correct"); });
    document.getElementById("feedback").textContent = "❌ " + phrase + " — sahi jawab highlight kiya gaya hai.";
  }
  document.getElementById("feedback").classList.remove("hidden");
  document.getElementById("next-btn").disabled = false;
}

function nextQuestion(){
  const lvl = LEVELS[currentLevelIdx];
  if(currentQIdx < lvl.questions.length - 1){
    currentQIdx++;
    renderQuestion();
  } else {
    finishLevel();
  }
}

function finishLevel(){
  const lvl = LEVELS[currentLevelIdx];
  const stars = starsFor(currentScore, lvl.questions.length);
  const prev = progress[lvl.id];
  if(!prev || stars > prev.stars){
    progress[lvl.id] = {stars, score: currentScore, total: lvl.questions.length};
    saveProgress();
  }
  document.getElementById("screen-quiz").classList.add("hidden");
  document.getElementById("screen-result").classList.remove("hidden");
  document.getElementById("result-emoji").textContent = stars === 3 ? "🏆" : stars >= 1 ? "🎉" : "💪";
  document.getElementById("result-score").textContent = currentScore + " / " + lvl.questions.length;
  document.getElementById("result-msg").textContent =
    stars === 3 ? "Perfect! Aapne sab sahi kiya." :
    stars === 2 ? "Bahut achha! Thoda aur practice karo full stars ke liye." :
    stars === 1 ? "Achhi shuruaat! Dobara try karke stars badhao." :
    "Koi baat nahi, dobara try karo!";
}

function goToMap(){
  document.getElementById("screen-quiz").classList.add("hidden");
  document.getElementById("screen-result").classList.add("hidden");
  document.getElementById("screen-map").classList.remove("hidden");
  renderMap();
}

function resetProgress(){
  progress = {};
  saveProgress();
  renderMap();
}

renderMap();
</script>
